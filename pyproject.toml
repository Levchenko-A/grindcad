[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grindcad"
version = "0.0.1"
description = "A small experimental CAD system written in Python"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
grindcad = "grindcad.main:main"

[tool.setuptools.packages.find]
where = ["src"]

